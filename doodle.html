<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle Studio | IGCT</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="club-games.css">
  <script type="module" src="app.js"></script>
</head>
<body class="studio-page">
  <main class="studio">
    <header class="studio-row">
      <a class="reaction-button" href="club.html#art">← Art &amp; Vote</a>
      <h1>🎨 Doodle Studio</h1>
      <button class="button button-purple" id="save-doodle" disabled>Share doodle</button>
    </header>
    <p id="studio-prompt">Opening your drawing space…</p>
    <canvas id="studio-canvas" width="800" height="560" aria-label="Drawing canvas"></canvas>
    <div class="studio-dock">
    <p class="studio-dock-hint" id="studio-tools-hint">Drawing tools · Swipe for more →</p>
    <fieldset id="studio-tools" class="studio-row" aria-label="Drawing tools" aria-describedby="studio-tools-hint" tabindex="0" disabled>

      <button type="button" data-tool="brush" aria-pressed="true">🖌️ Brush</button>
      <button type="button" data-tool="fill" aria-pressed="false">🪣 Fill</button>
      <button type="button" data-tool="eraser" aria-pressed="false">🧽 Eraser</button>
      <button type="button" data-tool="circle" aria-pressed="false">◯ Circle</button>
      <button type="button" data-tool="box" aria-pressed="false">□ Box</button>
      <label>Colour <input type="color" id="ink" value="#6b59e8"></label>
      <label>Brush size <select id="stroke-size"><option value="5">Small</option><option value="12" selected>Medium</option><option value="25">Big</option></select></label>
      <button type="button" id="undo-doodle">↶ Undo</button>
      <button type="button" id="clear-doodle">Clear</button>
    </fieldset>
    </div>

    <p id="club-message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
