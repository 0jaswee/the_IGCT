<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#6656e8"><title>Member login — IGCT</title><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body class="form-page"><main class="form-layout page-wrap login-layout"><a class="button button-purple" style="align-self:flex-start;min-height:48px" href="index.html">← <span>Come back to the club</span></a><section class="form-card login-card"><div class="form-mascot">🌈</div><div class="eyebrow">WELCOME BACK, FRIEND</div><h1>Ready to play?</h1><p class="form-lead">Enter the username and four-digit PIN you chose when you joined.</p><form id="login-form" novalidate><label for="username">Your username</label><div class="input-prefix"><span>@</span><input id="username" name="username" maxlength="16" autocomplete="username" placeholder="Your username" required></div><label for="pin">Your 4-digit PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" placeholder="••••" required><p class="form-error" id="login-error" role="alert"></p><button class="button button-purple full-button" type="submit">Let’s go! <b>→</b></button></form><div class="help-note"><span>💡</span><p>Forgot your PIN? Ask the trusted grown-up who helped you join.</p></div><p class="form-switch">New to the team? <a href="join.html">Join the group</a></p></section><p class="page-footnote">A grown-up can help keep your team safe.</p></main></body></html>
